<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabelkasten Schnelltest</title>
<style>
  :root { --bg:#f3f1ec; --text:#1f1d1a; --dim:#6b675f; --ok:#3f7d4e; --fail:#b5452f; --rule:#dcd7cc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161513; --text:#ece8e0; --dim:#a39d92; --rule:#34312c; } }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Georgia, "Times New Roman", serif; }
  .wrap { display:flex; gap:20px; padding:16px; flex-wrap:wrap; }
  .links { flex:1 1 320px; min-width:0; }
  h1 { font-size:21px; margin:0 0 4px; }
  p { color:var(--dim); margin:0 0 12px; }
  button { font:inherit; padding:10px 16px; border-radius:3px; border:1px solid var(--text); background:var(--text); color:var(--bg); cursor:pointer; }
  button:disabled { opacity:.5; }
  #summe { font-weight:700; margin:12px 0; }
  #summe.ok { color:var(--ok); } #summe.fail { color:var(--fail); }
  ol { padding-left:22px; margin:0; }
  li { margin:4px 0; }
  li.fail { color:var(--fail); }
  li small { display:block; color:var(--dim); }
  iframe { width:390px; height:780px; border:1px solid var(--rule); border-radius:10px; background:#fff; flex:0 0 auto; max-width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="links">
    <h1>Vokabelkasten Schnelltest</h1>
    <p>Klickt sich einmal durch die wichtigsten Wege der App. Läuft nur lokal (localhost). Dein Lernstand wird vorher
      beiseitegelegt und danach wiederhergestellt.</p>
    <button id="los" type="button">Test starten</button>
    <div id="summe"></div>
    <ol id="liste"></ol>
  </div>
  <iframe id="app" title="App im Test"></iframe>
</div>
<script>
(function () {
  "use strict";
  var KEY = "vokabelkasten.v2";
  var iframe = document.getElementById("app"), liste = document.getElementById("liste"), summe = document.getElementById("summe");
  var W = null, D = null, fehler = [];
  var lokal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";

  function warte(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function bis(fn, ms, was) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 4000)) {
      try { var v = fn(); if (v) return v; } catch (e) {}
      await warte(50);
    }
    throw new Error("Zeitüberschreitung: " + (was || "Bedingung"));
  }
  function $(s) { return D.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(D.querySelectorAll(s)); }
  function id(x) { return D.getElementById(x); }
  function klick(s) { var el = typeof s === "string" ? $(s) : s; if (!el) throw new Error("nicht gefunden: " + s); el.click(); return el; }
  function pruefe(b, text) { if (!b) throw new Error(text); }
  function aktiv(view) { return id("view-" + view).classList.contains("active"); }
  function eingeben(el, wert) { el.value = wert; el.dispatchEvent(new W.Event("input", { bubbles: true })); }
  function absenden() { id("eingabe").requestSubmit ? id("eingabe").requestSubmit() : klick("#eingabe-los"); }

  function binden() {
    W = iframe.contentWindow; D = W.document;
    W.addEventListener("error", function (e) { fehler.push(String(e.message || e)); });
    var alt = W.console.error;
    W.console.error = function () { fehler.push(Array.prototype.join.call(arguments, " ")); return alt.apply(W.console, arguments); };
  }
  function laden() {
    return new Promise(function (ok) {
      iframe.onload = function () { binden(); setTimeout(ok, 400); };
      iframe.src = "index.html?schnelltest=" + Date.now();
    });
  }
  /* wie ein Android-Handy: Teilen von Dateien ist vorhanden (der Test-Browser hat das sonst nicht).
     Die App wird dafür als srcdoc geladen, mit zwei vorangestellten Zeilen - gleicher Ursprung, gleicher Speicher. */
  async function ladenMitTeilen() {
    var html = await (await fetch("index.html?roh=" + Date.now())).text();
    var vorspann = '<script>navigator.share = function () { return Promise.resolve(); }; navigator.canShare = function () { return true; };<\/script>';
    html = html.replace(/<head>/i, "<head>" + vorspann);
    return new Promise(function (ok) {
      iframe.onload = function () { binden(); setTimeout(ok, 500); };
      iframe.removeAttribute("src");
      iframe.srcdoc = html;
    });
  }
  // die App lädt sich selbst neu (Kasten wechseln): auf das nächste „load“ warten
  function neuGeladen(aktion) {
    return new Promise(function (ok) {
      iframe.onload = function () { binden(); setTimeout(ok, 400); };
      aktion();
    });
  }

  var TESTS = [
    ["Startseite und Navigation", async function () {
      await laden();
      await bis(function () { return $('[data-ziel="karten"]'); }, 5000, "Startseite");
      pruefe($$("[data-view]").length >= 5, "Navigation unten fehlt");
      var ziele = $$("nav button").map(function (b) { return b.dataset.view; }).join(" ");
      pruefe(W.getComputedStyle($("nav")).display !== "none" && ziele === "start ueben liste neu sichern", "Leiste unten: " + ziele);
      pruefe($('nav [data-view="start"]').getAttribute("aria-current") === "page", "Start ist in der Leiste nicht markiert");
    }],
    ["Einführung: nur beim ersten Start, fünf Seiten, danach in den Einstellungen", async function () {
      await bis(function () { return !id("einf").hidden; }, 3000, "Einführung beim ersten Start");   // der Test startet ohne Daten
      var titel = [], erste = id("einf-text").textContent;
      for (var i = 0; i < 5; i++) {
        titel.push(id("einf-titel").textContent);
        pruefe($$("#einf-punkte i").length === 5 && $$("#einf-punkte i")[i].classList.contains("an"), "Punkt " + (i + 1) + " nicht markiert");
        klick("#einf-weiter");
      }
      pruefe(titel.join(" | ") === "Willkommen im Vokabelkasten | Selbst antworten | Lernen nebenbei | Quiz-Duell (Beta) | Neue Wörter, eigene Kästen", "Seiten: " + titel.join(" | "));
      pruefe(/\d+ englischen Vokabeln/.test(erste), "Anzahl fehlt: " + erste);
      pruefe(id("einf").hidden, "„Los geht's“ schließt die Einführung nicht");
      pruefe(W.localStorage.getItem("vokabelkasten.einfuehrung") === "1", "Einführung nicht als gesehen gemerkt");
      await laden();
      await warte(500);
      pruefe(id("einf").hidden, "Einführung kommt nach dem Neuladen wieder");
      klick('[data-view="sichern"]');
      klick("#btn-einfuehrung");
      pruefe(!id("einf").hidden, "Einführung lässt sich in den Einstellungen nicht öffnen");
      klick("#einf-weg");
      pruefe(id("einf").hidden, "„Überspringen“ schließt nicht");
      klick('[data-view="ueben"]');
    }],
    ["Üben: erste Karten aufnehmen", async function () {
      klick('[data-ziel="karten"]');
      await bis(function () { return aktiv("ueben"); }, 3000, "Übungsansicht");
      if (id("trainer").hidden) {
        var b = await bis(function () { return $("#leer button"); }, 3000, "Knopf zum Aufnehmen");
        klick(b);
      }
      await bis(function () { return !id("trainer").hidden && id("vorne").textContent; }, 3000, "Karte");
    }],
    ["Aufdecken und „Gewusst“: Karte wandert, Abstand wird angezeigt", async function () {
      klick("#karte");
      await bis(function () { return !id("bewertung").hidden; }, 2000, "Bewertung");
      klick("#btn-gewusst");
      var m = id("meldung").textContent;
      pruefe(/Fach 2/.test(m) && /wieder|heute/.test(m), "Meldung passt nicht: " + m);
    }],
    ["Eintippen: nur wenn eingestellt, gnädig bei Tippfehlern", async function () {
      pruefe(id("eingabe").hidden, "Eingabefeld ist sichtbar, obwohl Aufdecken eingestellt ist");
      klick('[data-view="sichern"]');
      klick(await bis(function () { return $('#eingabewahl [data-eingabe="tippen"]'); }, 3000, "Einstellung Antwort"));
      klick('[data-view="ueben"]');
      await bis(function () { return !id("eingabe").hidden; }, 3000, "Eingabefeld");
      var loesung = id("hinten").textContent.split(/\s*[\/;]\s*/)[0].replace(/\([^)]*\)/g, "").replace(/^to /, "").trim();
      var mitFehler = loesung.length > 5 ? loesung.slice(0, 2) + loesung.slice(3) : loesung;   // ein Buchstabe fehlt
      eingeben(id("eingabe-feld"), mitFehler);
      absenden();
      await bis(function () { return !id("eingabe-ergebnis").hidden; }, 2000, "Ergebnis");
      pruefe(id("eingabe-ergebnis").classList.contains("ok"), "„" + mitFehler + "“ für „" + loesung + "“ nicht akzeptiert: " + id("eingabe-ergebnis").textContent);
      pruefe(id("btn-gewusst").classList.contains("vorschlag"), "Gewusst ist nicht vorgeschlagen");
      var vorher = id("vorne").textContent;
      absenden();   // Enter / Weiter übernimmt den Vorschlag
      await bis(function () { return id("vorne").textContent !== vorher || id("trainer").hidden; }, 2000, "nächste Karte");
      if (!id("trainer").hidden) {
        eingeben(id("eingabe-feld"), "qqqq zzz");
        absenden();
        await bis(function () { return !id("eingabe-ergebnis").hidden; }, 2000, "Ergebnis falsch");
        pruefe(id("eingabe-ergebnis").classList.contains("falsch"), "falsche Antwort wurde akzeptiert");
        pruefe(id("btn-nochmal").classList.contains("vorschlag"), "Nochmal ist nicht vorgeschlagen");
      }
      klick('[data-view="sichern"]');
      klick('#eingabewahl [data-eingabe="aufdecken"]');
      klick('[data-view="ueben"]');
      pruefe(id("eingabe").hidden, "Eingabefeld bleibt nach dem Zurückstellen sichtbar");
      // dieselbe Wahl direkt unter der Karte: Aufdecken | Schreiben | Sprechen, mit den Einstellungen verbunden
      pruefe($$("#antwortwahl button").length === 3 && $("#antwortwahl #btn-sprache"), "Auswahl unter der Karte fehlt");
      klick('#antwortwahl [data-eingabe="tippen"]');
      pruefe(!id("eingabe").hidden, "„Schreiben“ unter der Karte zeigt kein Eingabefeld");
      pruefe($('#eingabewahl [data-eingabe="tippen"]').getAttribute("aria-pressed") === "true", "Einstellungen zeigen „Schreiben“ nicht an");
      klick('#antwortwahl [data-eingabe="aufdecken"]');
      pruefe(id("eingabe").hidden && $('#antwortwahl [data-eingabe="aufdecken"]').getAttribute("aria-pressed") === "true", "„Aufdecken“ unter der Karte wirkt nicht");
    }],
    ["Liste und Suche", async function () {
      klick('[data-view="liste"]');
      await bis(function () { return $$("#liste li").length > 100; }, 3000, "Vokabelliste");
      var alle = $$("#liste li").length;
      eingeben(id("suche"), "qqxxzz");
      pruefe($$("#liste li").length < alle, "Suche filtert nicht");
      eingeben(id("suche"), "");
      pruefe($$("#liste li").length === alle, "Liste kommt nach leerer Suche nicht zurück");
    }],
    ["Statistik öffnen", async function () {
      klick('[data-view="ueben"]');
      // Tagesziel steht beim Üben oben rechts, „x offen“ vorn in der Auswahlzeile
      pruefe(!id("kopf-ziel").hidden && /Heute \d+ \/ \d+/.test(id("kopf-ziel").textContent), "Tagesziel oben rechts fehlt: " + id("kopf-ziel").textContent);
      pruefe(/offen|im Kasten|Auswahl/.test($("#auswahl .aw-l").textContent), "Auswahlzeile zeigt nicht, was offen ist: " + $("#auswahl .aw-l").textContent);
      pruefe(id("kasten-leiste").nextElementSibling === $(".st-hero") && !$(".st-liste"), "Kästen stehen nicht oben über der großen Karte, oder Liste/Neu sind noch auf der Startseite");
      klick("#kopf-ziel");
      await bis(function () { return aktiv("statistik"); }, 3000, "Statistik");
    }],
    ["Sicherung: Knöpfe vorhanden", async function () {
      klick('[data-view="sichern"]');
      pruefe(id("btn-export") && id("btn-import"), "Herunterladen/Einlesen fehlt");
      pruefe(id("btn-teilen"), "Teilen-Knopf fehlt");
    }],
    ["Schnell anlegen auf der Startseite (neu und schon vorhanden)", async function () {
      klick('[data-view="ueben"]');
      await laden();
      await bis(function () { return id("sn-en"); }, 5000, "Feld auf der Startseite");
      eingeben(id("sn-en"), "zzqtestword");
      pruefe(!id("sn-mehr").hidden, "Felder für Deutsch/Beispielsatz erscheinen nicht");
      id("sn-de").value = "Testwort";
      id("schnell").requestSubmit();
      pruefe(/liegt im Kasten/.test(id("sn-info").textContent), "keine Bestätigung: " + id("sn-info").textContent);
      pruefe(id("sn-en").value === "", "Feld wird nach dem Speichern nicht geleert");
      eingeben(id("sn-en"), "zzqtestword");
      pruefe(/schon im Kasten/.test(id("sn-info").textContent), "doppeltes Wort nicht erkannt: " + id("sn-info").textContent);
      id("schnell").requestSubmit();   // ohne Deutsch: vorhandene Karte statt doppelter
      var n = JSON.parse(W.localStorage.getItem(KEY)).cards.filter(function (c) { return c.back === "zzqtestword"; }).length;
      pruefe(n === 1, "Wort ist " + n + "-mal gespeichert");
    }],
    ["Kästen: anlegen, wechseln ohne Neuladen, Texte, Einlesen ohne Doppel, Menü, Papierkorb", async function () {
      await laden();
      var enVorher = W.localStorage.getItem(KEY), enKarten = JSON.parse(enVorher).cards.length;
      var phVorher = id("sn-de").placeholder;
      W.__ohneNeuladen = true;   // verschwindet, falls die Seite doch neu lädt
      klick(await bis(function () { return $(".kasten-reiter.plus"); }, 3000, "„+“ für neuen Kasten"));
      pruefe(!id("kasten-dialog").hidden, "Frage nach dem Thema erscheint nicht");
      id("kasten-name").value = "Testthema";
      id("kasten-form").requestSubmit();
      await bis(function () { return id("st-hero-name").textContent === "Testthemakasten"; }, 3000, "Wechsel in den neuen Kasten");
      pruefe(W.__ohneNeuladen === true, "Seite wurde neu geladen");
      pruefe(D.documentElement.hasAttribute("data-wissen"), "Wissenskasten nicht erkannt");
      pruefe(id("sn-de").placeholder === "Bedeutung", "Wissens-Texte fehlen: " + id("sn-de").placeholder);
      pruefe(id("sel-kat").options.length === 6, "Kategorien im Wissenskasten: " + id("sel-kat").options.length);
      eingeben(id("sn-en"), "ABC");
      id("sn-de").value = "Testbedeutung";
      id("schnell").requestSubmit();
      var reg = JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten"));
      var karten = JSON.parse(W.localStorage.getItem("vokabelkasten.kasten." + reg.aktiv)).cards;
      pruefe(karten.length === 1 && karten[0].front === "ABC" && karten[0].back === "Testbedeutung", "Begriff falsch gespeichert: " + JSON.stringify(karten));
      pruefe(JSON.parse(W.localStorage.getItem(KEY)).cards.length === enKarten, "Begriff ist im Englisch-Kasten gelandet");
      klick($$(".kasten-reiter")[0]);
      await bis(function () { return id("st-hero-name").textContent === "Vokabelkasten"; }, 3000, "zurück im Englisch-Kasten");
      pruefe(W.__ohneNeuladen === true, "Seite wurde beim Zurückwechseln neu geladen");
      pruefe(!D.documentElement.hasAttribute("data-wissen"), "noch als Wissenskasten markiert");
      pruefe(id("sn-de").placeholder === phVorher, "Texte nicht zurückgesetzt: " + id("sn-de").placeholder);
      var enNach = JSON.parse(W.localStorage.getItem(KEY));
      pruefe(enNach.cards.length === enKarten && JSON.stringify(enNach.cards) === JSON.stringify(JSON.parse(enVorher).cards), "Englisch-Kasten hat sich verändert");
      pruefe(id("sel-kat").options.length === 2 + W.VK_DATEN.SEED.kats.length, "Kategorien doppelt oder falsch: " + id("sel-kat").options.length);
      // wieder hin und den offenen Kasten löschen: zurück zu Englisch, Testkasten weg
      klick($$(".kasten-reiter")[1]);
      await bis(function () { return id("st-hero-name").textContent === "Testthemakasten"; }, 3000, "erneut im Testkasten");
      pruefe(JSON.parse(W.localStorage.getItem("vokabelkasten.kasten." + reg.aktiv)).cards.length === 1, "Karte im Testkasten fehlt nach dem Wechsel");
      // Einlesen einer Sicherung mit gleichnamigem Kasten (andere Kennung): kein doppelter Kasten, Karte kommt dazu
      W.alert = function () {};
      var sich = { v: 2, seeded: true, cards: [], kaesten: [{ id: "kanders", name: "Testthema", farbe: 2, art: "wissen" }],
                   kastenDaten: { kanders: { cards: [{ id: "x1", front: "DEF", back: "Zweite Bedeutung", kat: 0, aktiv: true, box: 1 }] } } };
      var dt = new W.DataTransfer(); dt.items.add(new W.File([JSON.stringify(sich)], "sicherung.json", { type: "" }));
      id("file").files = dt.files; id("file").dispatchEvent(new W.Event("change", { bubbles: true }));
      await bis(function () { return JSON.parse(W.localStorage.getItem("vokabelkasten.kasten." + reg.aktiv)).cards.length === 2; }, 3000, "Karte aus der Sicherung im vorhandenen Kasten");
      pruefe(JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten")).liste.length === 2, "Einlesen hat einen doppelten Kasten angelegt");
      pruefe(!id("file").hasAttribute("accept"), "Dateiauswahl schränkt die Dateitypen wieder ein (Android graut .json aus)");
      // lange drücken: Menü mit Papierkorb, verschieben, umbenennen
      var reiter = $$(".kasten-reiter")[1];
      reiter.dispatchEvent(new W.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
      pruefe(!id("kasten-menue").hidden, "Menü nach langem Drücken erscheint nicht");
      pruefe(/2 Karten/.test(id("km-info").textContent), "Menü zeigt die Kartenzahl nicht: " + id("km-info").textContent);
      pruefe(id("km-links").disabled && id("km-rechts").disabled, "Verschieben sollte mit nur einem weiteren Kasten nicht gehen");
      klick("#km-papierkorb");
      await bis(function () { return id("st-hero-name").textContent === "Vokabelkasten"; }, 3000, "nach dem Papierkorb zurück bei Englisch");
      var regK = JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten"));
      pruefe(regK.liste.length === 1 && regK.papierkorb && regK.papierkorb.length === 1, "Testkasten liegt nicht im Papierkorb");
      pruefe(JSON.parse(W.localStorage.getItem("vokabelkasten.kasten." + reg.aktiv)).cards.length === 2, "Karten im Papierkorb verloren");
      // zurückholen, wieder in den Papierkorb, dann endgültig löschen
      var zurueck = $$("#kasten-verwalten button").filter(function (x) { return x.textContent === "Zurückholen"; })[0];
      pruefe(zurueck, "Zurückholen-Knopf fehlt");
      zurueck.click();
      pruefe(JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten")).liste.length === 2, "Zurückholen hat nicht geklappt");
      $$(".kasten-reiter")[1].dispatchEvent(new W.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
      klick("#km-papierkorb");
      W.confirm = function () { return true; };
      var endg = $$("#kasten-verwalten button").filter(function (x) { return x.textContent === "Endgültig löschen"; })[0];
      pruefe(endg, "Endgültig-löschen-Knopf fehlt");
      endg.click();
      pruefe(W.localStorage.getItem("vokabelkasten.kasten." + reg.aktiv) === null, "endgültig gelöschter Kasten ist noch gespeichert");
      regK = JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten"));
      pruefe(regK.liste.length === 1 && !regK.papierkorb.length, "Papierkorb nicht leer");
      pruefe(JSON.parse(W.localStorage.getItem(KEY)).cards.length === enKarten, "Englisch-Kasten nach dem Löschen verändert");
      pruefe(W.__ohneNeuladen === true, "Seite wurde beim Löschen neu geladen");
    }],
    ["Datei im offenen Kasten einlesen: landet dort, kein dritter Kasten", async function () {
      klick(await bis(function () { return $(".kasten-reiter.plus"); }, 3000, "„+“ für neuen Kasten"));
      id("kasten-name").value = "Gardena";
      id("kasten-form").requestSubmit();
      await bis(function () { return id("st-hero-name").textContent === "Gardenakasten"; }, 3000, "Wechsel in den Gardenakasten");
      var reg = JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten")), gid = reg.aktiv, kaesten = reg.liste.length;
      // Quiz-Duell und Sprechen gibt es auch im Wissenskasten; lange drücken verkleinert die Kachel (je Kasten)
      var quiz = $('.st-kachel[data-ziel="quiz"]');
      pruefe(W.getComputedStyle(quiz).display !== "none" && W.getComputedStyle(id("btn-sprache")).display !== "none", "Quiz-Duell oder Sprechen fehlt im Wissenskasten");
      quiz.dispatchEvent(new W.PointerEvent("pointerdown", { bubbles: true, pointerType: "touch" }));   // wie ein Finger: erst auflegen, dann lange drücken
      quiz.dispatchEvent(new W.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
      await bis(function () { return !id("blatt").hidden && /Verkleinern/.test(id("blatt-knoepfe").textContent); }, 2000, "Menü „Verkleinern“");
      klick($("#blatt-knoepfe button"));
      pruefe(quiz.classList.contains("klein") && $(".st-paar").classList.contains("mit-klein"), "Kachel wird nicht verkleinert");
      quiz.dispatchEvent(new W.PointerEvent("pointerdown", { bubbles: true, pointerType: "touch" }));   // wie ein Finger: erst auflegen, dann lange drücken
      quiz.dispatchEvent(new W.MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
      await bis(function () { return !id("blatt").hidden && /Wieder groß/.test(id("blatt-knoepfe").textContent); }, 2000, "Menü „Wieder groß anzeigen“");
      klick($("#blatt-knoepfe button"));
      pruefe(!quiz.classList.contains("klein"), "Kachel wird nicht wieder groß");
      var enVorher = W.localStorage.getItem(KEY);
      function karten() { return JSON.parse(W.localStorage.getItem("vokabelkasten.kasten." + gid)).cards; }
      function datei(inhalt) {
        var dt = new W.DataTransfer(); dt.items.add(new W.File([JSON.stringify(inhalt)], "liste.json", { type: "" }));
        id("file").files = dt.files; id("file").dispatchEvent(new W.Event("change", { bubbles: true }));
      }
      async function antwort(nr, text) {
        await bis(function () { return !id("blatt").hidden && $$("#blatt-knoepfe button").length === 2; }, 3000, "Frage „wohin?“");
        var b = $$("#blatt-knoepfe button")[nr];
        pruefe(text.test(b.textContent), "Knopf heißt: " + b.textContent);
        klick(b);
      }
      W.alert = function () {};
      // 1. Datei mit einem anderen Kastennamen: auf Wunsch in den offenen Kasten, kein neuer Kasten
      datei({ v: 2, cards: [], kaesten: [{ id: "kfremd", name: "Gardena Vokabeln" }], kastenDaten: { kfremd: { cards: [{ front: "GHI", back: "Eins", kat: 0 }] } } });
      await antwort(0, /offenen Gardenakasten/);
      await bis(function () { return karten().length === 1; }, 3000, "Karte im offenen Kasten");
      pruefe(JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten")).liste.length === kaesten, "es wurde trotzdem ein Kasten angelegt");
      // 2. Nur Karten oben (Format des Englisch-Kastens): ebenfalls in den offenen Kasten, Englisch bleibt unverändert
      datei({ cards: [{ front: "JKL", back: "Zwei" }] });
      await antwort(0, /offenen Gardenakasten/);
      await bis(function () { return karten().length === 2; }, 3000, "zweite Karte im offenen Kasten");
      pruefe(W.localStorage.getItem(KEY) === enVorher, "Englisch-Kasten wurde verändert");
      // 3. „Wie in der Datei“ legt wie bisher einen eigenen Kasten an
      datei({ v: 2, cards: [], kaesten: [{ id: "kfremd", name: "Gardena Vokabeln" }], kastenDaten: { kfremd: { cards: [{ front: "MNO", back: "Drei", kat: 0 }] } } });
      await antwort(1, /neuen Gardena Vokabelnkasten/);
      await bis(function () { return JSON.parse(W.localStorage.getItem("vokabelkasten.kaesten")).liste.length === kaesten + 1; }, 3000, "Kasten wie in der Datei");
      pruefe(karten().length === 2, "Karte ist trotzdem im offenen Kasten gelandet");
      // 4. Datei für genau den offenen Kasten: keine Frage
      datei({ v: 2, cards: [], kaesten: [{ id: gid, name: "Gardena" }], kastenDaten: (function () { var o = {}; o[gid] = { cards: [{ front: "PQR", back: "Vier", kat: 0 }] }; return o; })() });
      await bis(function () { return karten().length === 3; }, 3000, "Karte ohne Rückfrage im offenen Kasten");
      pruefe(id("blatt").hidden, "unnötige Rückfrage beim eigenen Kasten");
      klick($$(".kasten-reiter")[0]);
      await bis(function () { return id("st-hero-name").textContent === "Vokabelkasten"; }, 3000, "zurück im Englisch-Kasten");
    }],
    ["Liste einfügen: – und : als Trennzeichen, Spalten tauschen, Foto-Feld", async function () {
      W.alert = function () {};
      klick('[data-view="neu"]');
      await bis(function () { return aktiv("neu"); }, 2000, "Ansicht Neu");
      pruefe(id("foto-hilfe").hidden && W.getComputedStyle(id("foto-hilfe")).display === "none", "Foto-Feld ist schon vor dem Foto sichtbar");
      eingeben(id("einfuegen"), "• Testhaus – testhouse\n2. Testbaum - testtree\nTest-Mail: testmail\ntestlaufen — to testrun – Wir testen.");
      var v = function () { return id("vorschau").textContent; };
      await bis(function () { return /4 neue Vokabeln/.test(v()); }, 2000, "vier Zeilen erkannt: " + v());
      pruefe(/Deutsch „Testhaus“, Englisch „testhouse“/.test(v()), "Vorschau: " + v());
      klick("#imp-tausch");
      pruefe(/Deutsch „testhouse“, Englisch „Testhaus“/.test(v()), "Spalten tauschen wirkt nicht: " + v());
      klick("#imp-tausch");
      klick("#btn-import-text");
      // Rückmeldung: Einblend-Meldung unten und Bestätigung direkt unter dem Feld (kein System-Dialog)
      pruefe(!id("meldung-leiste").hidden && /4 Vokabeln angelegt/.test(id("meldung-leiste").textContent), "keine Meldung nach dem Einlesen: " + id("meldung-leiste").textContent);
      pruefe(/^✓ 4 Vokabeln angelegt/.test(id("vorschau").textContent), "keine Bestätigung unter dem Feld: " + id("vorschau").textContent);
      var en = JSON.parse(W.localStorage.getItem(KEY)).cards;
      var l = en.filter(function (c) { return c.front === "testlaufen"; })[0];
      pruefe(l && l.back === "to testrun" && l.bsp === "Wir testen.", "Beispiel nicht erkannt: " + JSON.stringify(l));
      pruefe(en.some(function (c) { return c.front === "Test-Mail" && c.back === "testmail"; }), "„Test-Mail: testmail“ falsch geteilt");
      pruefe(en.some(function (c) { return c.front === "Testbaum" && c.back === "testtree"; }), "Nummer oder „ - “ nicht erkannt");
      // Foto einer Liste: Feld mit Bild und Anleitung, Schließen räumt auf
      var dt = new W.DataTransfer(); dt.items.add(new W.File([new Uint8Array([255, 216, 255])], "liste.jpg", { type: "image/jpeg" }));
      id("foto-datei").files = dt.files; id("foto-datei").dispatchEvent(new W.Event("change", { bubbles: true }));
      await bis(function () { return !id("foto-hilfe").hidden; }, 2000, "Foto-Feld");
      pruefe(/^blob:/.test(id("foto-bild").src), "Foto wird nicht gezeigt");
      pruefe($$("#foto-schritte li").length === 3, "Anleitung fehlt");
      klick("#btn-foto-zu");
      pruefe(id("foto-hilfe").hidden && !id("foto-bild").getAttribute("src"), "Schließen räumt nicht auf");
      // Begriff und Bedeutung je in einer eigenen Zeile (wie aus PDFs und Google Lens): immer zwei Zeilen = eine Karte
      eingeben(id("einfuegen"), "Tensible Modules \nZugmodul\n\nTensible Stress\nZugspannung: Kraft pro Fläche\nOhne Partner");
      pruefe(/2 neue Vokabeln/.test(v()) && /je zwei Zeilen/.test(v()) && /letzte Zeile ohne Partner/.test(v()), "Zeilenpaare nicht erkannt: " + v());
      pruefe(/Deutsch „Tensible Modules“, Englisch „Zugmodul“/.test(v()), "Zeilenpaar falsch zugeordnet: " + v());
      klick("#imp-tausch");
      pruefe(/Deutsch „Zugmodul“, Englisch „Tensible Modules“/.test(v()), "Tauschen wirkt bei Zeilenpaaren nicht: " + v());
      klick("#imp-tausch");
      eingeben(id("einfuegen"), "");
    }],
    ["Geteilt aus einer anderen App (Android): Liste und einzelnes Wort", async function () {
      await new Promise(function (ok) {
        iframe.onload = function () { binden(); setTimeout(ok, 500); };
        iframe.src = "index.html?text=" + encodeURIComponent("Testsonne – testsun\nTestmond – testmoon");
      });
      await bis(function () { return aktiv("neu"); }, 3000, "geteilte Liste öffnet „Ganze Liste einfügen“");
      pruefe(id("einfuegen").value.split("\n").length === 2, "Liste nicht im Feld: " + id("einfuegen").value);
      pruefe(/2 neue Vokabeln/.test(id("vorschau").textContent), "Vorschau: " + id("vorschau").textContent);
      pruefe(!/text=/.test(W.location.search), "Adresse enthält noch den geteilten Text");
      await new Promise(function (ok) {
        iframe.onload = function () { binden(); setTimeout(ok, 500); };
        iframe.src = "index.html?text=" + encodeURIComponent("serendipity");
      });
      await bis(function () { return aktiv("start") && id("sn-en").value === "serendipity"; }, 3000, "einzelnes Wort im Schnell-Anlegen");
      pruefe(id("sn-scan").hidden && W.getComputedStyle(id("sn-scan")).display === "none", "Scan-Knopf ist am Computer sichtbar");
      pruefe(id("sn-scan-feld").hidden && W.getComputedStyle(id("sn-scan-feld")).display === "none", "Scan-Feld ist ohne Foto sichtbar");
    }],
    ["Lernstand übersteht Neustart auch mit Teilen-Funktion (wie am Handy)", async function () {
      var vorher = W.localStorage.getItem(KEY);
      var faecher = JSON.parse(vorher).cards.filter(function (c) { return c.aktiv; }).length;
      pruefe(faecher > 0, "Test braucht Karten im Kasten");
      await ladenMitTeilen();
      await bis(function () { return D.getElementById("st-hero-name"); }, 5000, "Startseite mit Teilen");
      var nachher = JSON.parse(W.localStorage.getItem(KEY));
      var imKasten = nachher.cards.filter(function (c) { return c.aktiv; }).length;
      pruefe(imKasten === faecher, "Lernstand verändert: vorher " + faecher + " im Kasten, nachher " + imKasten);
      iframe.removeAttribute("srcdoc");
    }],
    ["Keine Skriptfehler", async function () {
      pruefe(!fehler.length, fehler.slice(0, 3).join(" | "));
    }]
  ];

  function eintrag(name) { var li = document.createElement("li"); li.textContent = name + " …"; liste.appendChild(li); return li; }

  document.getElementById("los").addEventListener("click", async function () {
    var knopf = this;
    if (!lokal) { summe.className = "fail"; summe.textContent = "Nur lokal ausführen (localhost) – sonst würde der Test deinen echten Lernstand anfassen."; return; }
    knopf.disabled = true; liste.innerHTML = ""; summe.textContent = ""; fehler = [];
    var gesichert = {}, ss = {};
    for (var g = 0; g < localStorage.length; g++) { var gk = localStorage.key(g); if (/^vokabelkasten\./.test(gk)) gesichert[gk] = localStorage.getItem(gk); }
    for (var i = 0; i < sessionStorage.length; i++) { var k = sessionStorage.key(i); ss[k] = sessionStorage.getItem(k); }
    Object.keys(gesichert).forEach(function (k) { localStorage.removeItem(k); });   // frischer Stand, damit der Test immer gleich läuft
    var ok = 0, schlecht = 0;
    try {
      for (var t = 0; t < TESTS.length; t++) {
        var li = eintrag(TESTS[t][0]);
        try { await TESTS[t][1](); li.textContent = "✓ " + TESTS[t][0]; ok++; }
        catch (e) {
          li.className = "fail"; li.textContent = "✗ " + TESTS[t][0];
          var sm = document.createElement("small"); sm.textContent = e && e.message ? e.message : String(e); li.appendChild(sm);
          schlecht++;
        }
      }
    } finally {
      iframe.src = "about:blank";
      await warte(200);
      for (var h = localStorage.length - 1; h >= 0; h--) { var hk = localStorage.key(h); if (/^vokabelkasten\./.test(hk)) localStorage.removeItem(hk); }
      Object.keys(gesichert).forEach(function (k) { localStorage.setItem(k, gesichert[k]); });
      sessionStorage.clear(); Object.keys(ss).forEach(function (k) { sessionStorage.setItem(k, ss[k]); });
      summe.className = schlecht ? "fail" : "ok";
      summe.textContent = schlecht ? schlecht + " von " + TESTS.length + " Prüfungen fehlgeschlagen" : "Alles in Ordnung: " + ok + " von " + TESTS.length + " Prüfungen bestanden";
      document.title = (schlecht ? "✗ " : "✓ ") + "Vokabelkasten Schnelltest";
      knopf.disabled = false;
    }
  });
  if (/[?&]auto\b/.test(location.search)) document.getElementById("los").click();
})();
</script>
